# ProofDrop local stack.
#   docker compose up -d --build        # everything: http://localhost:8080 (dashboard), :3000 (API)
#   docker compose up -d postgres minio # just the infrastructure, for `npm run start:dev`
name: proofdrop

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: proofdrop
      POSTGRES_PASSWORD: proofdrop
      POSTGRES_DB: proofdrop
    # Host port 5433 so it doesn't clash with a locally installed PostgreSQL on 5432.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofdrop -d proofdrop"]
      interval: 3s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for evidence photos. (The official minio/minio image is no
  # longer published on Docker Hub; this is the same MinIO server packaged by Bitnami.)
  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: proofdrop
      MINIO_ROOT_PASSWORD: proofdrop-secret
      MINIO_DEFAULT_BUCKETS: evidence
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9000/minio/health/live || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    environment:
      PORT: 3000
      DATABASE_URL: postgresql://proofdrop:proofdrop@postgres:5432/proofdrop?schema=public
      JWT_SECRET: local-dev-secret-change-me-in-production
      STORAGE_DRIVER: s3
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: proofdrop
      S3_SECRET_KEY: proofdrop-secret
      S3_BUCKET: evidence
      # Local dev only: creates the seed accounts from docs/API.md on start.
      SEED_DEMO_DATA: "true"
      SWAGGER_ENABLED: "true"
      # The dashboard's nginx proxies /api, so trust one hop of X-Forwarded-For.
      TRUST_PROXY: "1"
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
